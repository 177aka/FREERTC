<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTC Nomade</title>
    <style>
        .mobile-color-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 1;
            cursor: pointer;
            pointer-events: auto !important;
            -webkit-user-select: auto !important;
            user-select: auto !important;
        }
        .btn-wrapper {
            flex: 1;
            position: relative;
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="app.js" defer></script>
</head>

<body style="background-color: #044499;">

    <div id="screen-ticket" class="app-screen active">
        <div class="bg-container">
            <div class="bg-pattern"></div>
        </div>

        <header class="header">
            <button class="back-btn" id="btn-to-settings">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
        </header>

        <section class="animation-zone">
            <div class="logo-outer-circle">
                <img src="DROMALOGOTRANS.png" class="droma-logo" alt="Logo">
                <div id="orbit-follower" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 9999;">
                    <div class="orbital-system" id="orbit-node">
                        <div class="bubble green"></div>
                        <div class="bubble brown"></div>
                    </div>
                </div>
            </div>
        </section>

        <main class="ticket-container">
            <div class="card-ticket main-card">
                <div class="header-ticket">
                    <div class="verif-badge">
                        <img src="1VERIFTRANS.png" alt="Badge">
                    </div>
                    <div class="ticket-title-wrapper">
                        <div class="ticket-title" id="main-ticket-title">RTC - 1 passage - Général</div>
                    </div>
                </div>
                
                <div class="validity-info">
                    <div class="dates">
                        <div class="date-label">Période de validité</div>
                        <div class="date-item text-black">
                            <img src="CONFIRMGRENTRANS.png" class="cal-icon" alt="Valid">
                            <span id="activation-date">--/--/---- à --:--</span>
                        </div>
                        <div class="date-item text-black expiration-style">
                            <img src="EXPIRELOGO.png" class="cal-icon" alt="Expire">
                            <span id="expiration-date">--/--/---- à --:--</span>
                        </div>
                    </div>
                    <div class="qr-box">
                        <img src="QRCODETRANS.png" alt="QR Code">
                    </div>
                </div>
            </div>

            <div class="card-ticket rtc-card">
                <div class="rtc-header-row">
                    <div class="rtc-timer-wrapper">
                        <div class="rtc-timer" id="timer-display">0:00</div>
                    </div>
                    <div class="rtc-title-wrapper-centered">
                        <div class="rtc-title" id="footer-ticket-title">Réservé au RTC</div>
                    </div>
                </div>
                <div class="rtc-body">
                    <div class="rtc-date">
                        <img src="CONFIRMGRENTRANS.png" class="cal-icon" alt="Valid icon">
                        <span id="rtc-activation-date">--/--/---- à --:--</span>
                    </div>
                    <div class="rtc-serial" id="serial-display">1-XXXXXXXXXXXXX</div>
                </div>
            </div>

            <div class="progress-bar-container">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </main>
    </div>
    
    <div id="screen-settings" class="app-screen">
    <div class="settings-container">
        <h2>CONFIGURATION</h2>

        <div class="settings-card">
            <label class="settings-label">Code d'affiliation</label>
            <input type="password" id="affiliation-code-input" placeholder="Entrer le code d'affiliation..." class="settings-select" style="padding: 10px; border: 1px solid #ccc; border-radius: 8px;">
            <div id="affiliation-status-msg" style="font-size: 11px; color: #666; margin-top: 4px;">Laissez vide pour un usage personnel. Renseignez le code pour appliquer les couleurs à tout le monde.</div>
        </div>

        <!-- Section Réseau -->
        <div class="settings-card">
            <label for="network-select" class="settings-label">Réseau de transport</label>
            <div class="select-wrapper">
                <select id="network-select" class="settings-select">
                    <option value="rtc">RTC (Québec)</option>
                    <option value="levi">STLévis (Lévis)</option>
                </select>
            </div>
        </div>

        <!-- Section Image & Bulles -->
        <div class="settings-card">
            <label class="settings-label">Personnalisation des bulles</label>
            <div class="file-upload-wrapper">
                <label for="image-upload" class="custom-file-btn">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    Importer une image
                </label>
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
            </div>
            
            <div class="preview-container">
                <img id="image-preview" src="" alt="Aperçu" style="display: none;">
            </div>

            <div class="color-pickers-row">
                <div class="color-picker-group">
                    <span>Bulle 1</span>
                    <div class="color-btn-wrapper">
                        <button id="btn-pipette-1" class="pipette-circle"></button>
                        <input type="color" id="input-color-1" value="#00ff66">
                    </div>
                </div>
                <div class="color-picker-group">
                    <span>Bulle 2</span>
                    <div class="color-btn-wrapper">
                        <button id="btn-pipette-2" class="pipette-circle"></button>
                        <input type="color" id="input-color-2" value="#381d18">
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="settings-actions">
            <button id="btn-clear-cache" class="btn-action btn-danger">Réinitialiser l'application</button>
            <button id="btn-back-to-ticket" class="btn-action btn-primary">Enregistrer et Retourner</button>
        </div>
    </div>
</div>

</body>
</html>
